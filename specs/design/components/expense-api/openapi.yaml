openapi: 3.0.3
info:
  title: Expense Claims API
  version: 0.1.0
  description: Manages expense claim submission, approval, and payroll export.
servers:
  - url: /

security:
  - bearerAuth: []

paths:
  /expense-claims:
    parameters:
      - $ref: '#/components/parameters/UserId'
    get:
      operationId: listExpenseClaims
      summary: List expense claims visible to the caller
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [draft, submitted, approved, rejected] }
          description: Filter by claim status
        - name: employeeId
          in: query
          schema: { type: string }
          description: Filter by employee (manager/finance use)
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Matching claims
          content:
            application/json:
              schema:
                type: object
                required: [count, data]
                properties:
                  count: { type: integer, description: total matching items }
                  next: { type: string, nullable: true, description: relative URI of the next page }
                  previous: { type: string, nullable: true, description: relative URI of the previous page }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/ExpenseClaim' }
        '401':
          description: Missing or invalid caller identity
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    post:
      operationId: submitExpenseClaim
      summary: Submit a new expense claim
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ExpenseClaimInput' }
      responses:
        '201':
          description: Claim created and submitted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExpenseClaim' }
        '400':
          description: Invalid claim data
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          description: Missing or invalid caller identity
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /expense-claims/{claimId}:
    parameters:
      - $ref: '#/components/parameters/ClaimId'
      - $ref: '#/components/parameters/UserId'
    get:
      operationId: getExpenseClaim
      summary: Get a single expense claim
      responses:
        '200':
          description: The claim
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExpenseClaim' }
        '404':
          description: Claim not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          description: Missing or invalid caller identity
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    put:
      operationId: updateExpenseClaim
      summary: Edit a claim (only while draft or rejected, by its owner)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ExpenseClaimInput' }
      responses:
        '200':
          description: Updated claim
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExpenseClaim' }
        '400':
          description: Invalid claim data or claim not editable in its current status
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: Caller does not own this claim
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: Claim not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /expense-claims/{claimId}/receipt:
    parameters:
      - $ref: '#/components/parameters/ClaimId'
      - $ref: '#/components/parameters/UserId'
    post:
      operationId: uploadExpenseClaimReceipt
      summary: Upload or replace the receipt attachment for a claim
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        '200':
          description: Receipt stored; returns the updated claim
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExpenseClaim' }
        '400':
          description: Invalid or missing file
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: Claim not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /expense-claims/{claimId}/resubmit:
    parameters:
      - $ref: '#/components/parameters/ClaimId'
      - $ref: '#/components/parameters/UserId'
    post:
      operationId: resubmitExpenseClaim
      summary: Resubmit a previously rejected claim for approval
      responses:
        '200':
          description: Claim moved back to submitted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExpenseClaim' }
        '400':
          description: Claim is not in a resubmittable state
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: Caller does not own this claim
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: Claim not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /expense-claims/{claimId}/approve:
    parameters:
      - $ref: '#/components/parameters/ClaimId'
      - $ref: '#/components/parameters/UserId'
    post:
      operationId: approveExpenseClaim
      summary: Approve a pending claim (manager only)
      responses:
        '200':
          description: Claim approved
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExpenseClaim' }
        '403':
          description: Caller is not the claim's manager
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: Claim not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /expense-claims/{claimId}/reject:
    parameters:
      - $ref: '#/components/parameters/ClaimId'
      - $ref: '#/components/parameters/UserId'
    post:
      operationId: rejectExpenseClaim
      summary: Reject a pending claim (manager only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, description: Why the claim was rejected }
      responses:
        '200':
          description: Claim rejected
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExpenseClaim' }
        '403':
          description: Caller is not the claim's manager
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: Claim not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /payroll-exports:
    parameters:
      - $ref: '#/components/parameters/UserId'
    get:
      operationId: listPayrollExports
      summary: List past payroll export batches
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Export batches
          content:
            application/json:
              schema:
                type: object
                required: [count, data]
                properties:
                  count: { type: integer, description: total matching items }
                  next: { type: string, nullable: true, description: relative URI of the next page }
                  previous: { type: string, nullable: true, description: relative URI of the previous page }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/PayrollExport' }
    post:
      operationId: createPayrollExport
      summary: Generate a payroll export file from all unexported approved claims
      responses:
        '201':
          description: Export batch created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PayrollExport' }
        '400':
          description: No approved, unexported claims to export
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /payroll-exports/{exportId}/download:
    parameters:
      - $ref: '#/components/parameters/ExportId'
      - $ref: '#/components/parameters/UserId'
    get:
      operationId: downloadPayrollExport
      summary: Download the export file for a payroll export batch
      responses:
        '200':
          description: The export file (CSV)
          content:
            text/csv:
              schema: { type: string }
        '404':
          description: Export batch not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
  parameters:
    UserId:
      name: X-User-Id
      in: header
      required: true
      description: Caller identity injected by the gateway from the validated token
      schema: { type: string }
    ClaimId:
      name: claimId
      in: path
      required: true
      schema: { type: string }
      description: Expense claim identifier
    ExportId:
      name: exportId
      in: path
      required: true
      schema: { type: string }
      description: Payroll export batch identifier
    Limit:
      name: limit
      in: query
      schema: { type: integer, default: 20, maximum: 100 }
      description: Max items to return
    Offset:
      name: offset
      in: query
      schema: { type: integer, default: 0 }
      description: Items to skip

  schemas:
    ExpenseClaimInput:
      type: object
      required: [amount, category, expenseDate, description]
      properties:
        amount: { type: number, format: double, description: Claimed amount }
        category: { type: string, description: Expense category, e.g. Travel, Meals }
        expenseDate: { type: string, format: date, description: Date the expense was incurred }
        description: { type: string, description: What the expense was for }
    ExpenseClaim:
      allOf:
        - $ref: '#/components/schemas/ExpenseClaimInput'
        - type: object
          required: [id, employeeId, status, exported, createdAt, updatedAt]
          properties:
            id: { type: string }
            employeeId: { type: string }
            receiptUrl: { type: string, nullable: true, description: URL of the uploaded receipt, if any }
            status: { type: string, enum: [draft, submitted, approved, rejected] }
            rejectionReason: { type: string, nullable: true }
            exported: { type: boolean, description: Whether this claim was included in a payroll export }
            createdAt: { type: string, format: date-time }
            updatedAt: { type: string, format: date-time }
    PayrollExport:
      type: object
      required: [id, generatedBy, fileUrl, generatedAt, claimCount]
      properties:
        id: { type: string }
        generatedBy: { type: string, description: User id of the finance user who generated it }
        fileUrl: { type: string, description: Relative download URI for the export file }
        generatedAt: { type: string, format: date-time }
        claimCount: { type: integer, description: Number of claims included in this export }
    Error:
      type: object
      required: [code, message]
      properties:
        code: { type: integer, description: HTTP or application error code }
        message: { type: string, description: short human-readable label }
        description: { type: string, description: detailed explanation }
        moreInfo: { type: string, description: URI to documentation }
