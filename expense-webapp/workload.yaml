apiVersion: openchoreo.dev/v1alpha1
metadata:
  name: expense-webapp

dependencies:
  endpoints:
    - component: mm1-expense-api
      name: http
      visibility: project
      envBindings:
        address: EXPENSE_API_URL
  resources:
    - ref: mm1-user-auth
      envBindings:
        client_id: USER_AUTH_CLIENT_ID
        issuer: USER_AUTH_ISSUER
        jwks_url: USER_AUTH_JWKS_URL
        scopes: USER_AUTH_SCOPES
